spring:
  application:
    name: accommodation-service

  datasource:
    url: jdbc:postgresql://localhost:5432/accommodation
    username: accommodation
    password: accommodation

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: 8080
